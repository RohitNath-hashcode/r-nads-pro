[package]
name = "r-nads-proxy"
version = "0.1.0"
edition = "2021"
description = "Native high-performance reverse proxy gateway for R-NADS Pro using Pingora"
license = "Apache-2.0"

[dependencies]
r-nads-common = { path = "../../core/r-nads-common" }
r-nads-decision = { path = "../../core/r-nads-decision" }
r-nads-http = { path = "../../waf/r-nads-http" }
r-nads-waf = { path = "../../waf/r-nads-waf" }
r-nads-ratelimit = { path = "../../traffic/r-nads-ratelimit" }
r-nads-fingerprint = { path = "../../identity/r-nads-fingerprint" }
r-nads-bot-detection = { path = "../../identity/r-nads-bot-detection" }
r-nads-config = { path = "../../core/r-nads-config" }

pingora-core = "0.9"
pingora-proxy = "0.9"
pingora-load-balancing = "0.9"
pingora-error = "0.9"
pingora-http = "0.9"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
dashmap = "5.5"
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[dev-dependencies]

