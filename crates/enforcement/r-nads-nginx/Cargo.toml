[package]
name = "r-nads-nginx"
version = "0.1.0"
edition = "2021"

[dependencies]
r-nads-config = { path = "../../core/r-nads-config" }
r-nads-decision = { path = "../../core/r-nads-decision" }
dashmap = "5.5"
tiny_http = "0.12"
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = { version = "0.31" }

