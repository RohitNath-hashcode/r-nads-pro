[package]
name = "r-nads-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
r-nads-common = { path = "../r-nads-common" }
r-nads-producer = { path = "../r-nads-producer" }
r-nads-aggregator = { path = "../r-nads-aggregator" }
r-nads-inference = { path = "../r-nads-inference" }
crossbeam-channel = "0.5"
clap = { version = "4.4", features = ["derive"] }
ahash = "0.8"
ctrlc = "3.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
