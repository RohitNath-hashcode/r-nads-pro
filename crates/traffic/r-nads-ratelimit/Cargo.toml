[package]
name = "r-nads-ratelimit"
version = "0.1.0"
edition = "2021"
description = "High-performance multi-dimensional in-memory rate limiting engine"

[dependencies]
r-nads-common = { path = "../../core/r-nads-common" }
r-nads-decision = { path = "../../core/r-nads-decision" }
serde = { version = "1.0", features = ["derive"] }
dashmap = "5.5"
ahash = "0.8"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

