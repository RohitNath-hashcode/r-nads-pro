[package]
name = "r-nads"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossbeam-channel = "0.5"
etherparse = "0.13"
pcap-file = "2.0"
slab = "0.4"
hashbrown = "0.14"
ahash = "0.8"
ctrlc = "3.4"
tiny_http = "0.12"
dashmap = "5.5"
once_cell = "1.19"

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = { version = "0.31" }
pcap = "1.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "flow_table_bench"
harness = false
