# R-NADS Pro — Software Composition Analysis & Supply Chain Policy
# Configured for cargo-deny (https://github.com/EmbarkStudios/cargo-deny)

[advisories]
version = 2
# RustSec advisory database validation
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
unsound = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = false

# Explicitly ban known malicious, typosquatting, or insecure crates
deny = [
    { name = "openssl-src" }, # Prefer rustls / pure rust implementations
    { name = "net2" },        # Deprecated networking crate
]

[licenses]
version = 2
unlicensed = "deny"
confidence-threshold = 0.8

# Strict allowed open-source licenses for commercial enterprise compliance
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
