services:
  controller:
    build:
      context: .
      dockerfile: packaging/docker/Dockerfile.controller
    container_name: rnads-controller
    restart: unless-stopped
    ports:
      - "8089:8089"
    volumes:
      - controller-data:/var/lib/r-nads/controller

  agent:
    build:
      context: .
      dockerfile: packaging/docker/Dockerfile.agent
    container_name: rnads-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CONTROLLER_URL=http://127.0.0.1:8089
    volumes:
      - ./config.toml:/app/config.toml
      - ./model.json:/app/model.json
      - agent-data:/app/data
    depends_on:
      - controller

volumes:
  controller-data:
  agent-data:
